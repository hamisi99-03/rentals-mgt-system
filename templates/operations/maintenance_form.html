{% extends 'base.html' %}

{% block title %}{{ title }} &middot; {{ app_settings.company_name }}{% endblock %}

{% block content %}
  <div class="page-header">
    <div>
      <p class="text-faint mb-0"><a href="{% url 'maintenance' %}">&larr; Maintenance</a></p>
      <h1 class="page-title">{{ title }}</h1>
    </div>
  </div>
  <form method="post" novalidate>
    {% csrf_token %}
    <section class="panel">
      <div class="form-grid">
        {% include 'components/form_fields.html' with form=form %}
      </div>
      <div class="form-actions">
        <a class="btn" href="{% if request_obj %}{% url 'maintenance_detail' request_obj.pk %}{% else %}{% url 'maintenance' %}{% endif %}">Cancel</a>
        <button type="submit" class="btn btn--primary">Save request</button>
      </div>
    </section>
  </form>
{% endblock %}
