{% load core_extras %}
{% if field|widget_name == 'checkboxinput' %}
  <div class="form-field">
    <label class="checkbox-row" for="{{ field.id_for_label }}">
      {{ field }}
      <span>{{ field.label }}</span>
    </label>
    {% if field.help_text %}<span class="help-text">{{ field.help_text }}</span>{% endif %}
    {{ field.errors }}
  </div>
{% else %}
  <div class="form-field{% if field|widget_name == 'textarea' %} form-field--full{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<span class="help-text">{{ field.help_text }}</span>{% endif %}
    {{ field.errors }}
  </div>
{% endif %}
