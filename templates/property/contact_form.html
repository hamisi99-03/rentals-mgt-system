{% extends 'base.html' %}

{% block title %}{{ title }} &middot; {{ app_settings.company_name }}{% endblock %}

{% block content %}
  <div class="page-header">
    <div>
      <p class="text-faint mb-0"><a href="{% url 'tenant_detail' contact.tenant_id %}">&larr; {{ contact.tenant.business_name }}</a></p>
      <h1 class="page-title">{{ title }}</h1>
    </div>
  </div>
  <form method="post" novalidate>
    {% csrf_token %}
    <section class="panel">
      <div class="form-grid">
        {% include 'components/form_fields.html' with form=form %}
      </div>
      <div class="form-actions">
        <a class="btn" href="{% url 'tenant_detail' contact.tenant_id %}?tab=overview#contacts">Cancel</a>
        <button type="submit" class="btn btn--primary">Save contact</button>
      </div>
    </section>
  </form>
{% endblock %}
